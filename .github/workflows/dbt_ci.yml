name: dbt CI

# Every push and every pull request builds the whole project and runs the full
# test suite. A model that breaks a business rule fails the check before it can
# be merged — the same discipline applied to application code, applied to data.

on:
  push:
    branches: [main]
    paths: ['5_dbt_Analytics_Engineering/**']
  pull_request:
    paths: ['5_dbt_Analytics_Engineering/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 5_dbt_Analytics_Engineering

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb==1.10.1

      - name: Check project parses
        run: dbt parse --profiles-dir .

      - name: Build models and run all tests
        run: dbt build --profiles-dir .

      - name: Generate documentation
        run: dbt docs generate --profiles-dir .

      - name: Publish run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: 5_dbt_Analytics_Engineering/target/
          retention-days: 14
